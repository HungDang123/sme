services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sme_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sme_listening}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sme} -d ${POSTGRES_DB:-sme_listening}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./backend/gateway-service
    environment:
      PORT: "8080"
      BRAND_SERVICE_URL: http://brand-service:8081
      MENTION_SERVICE_URL: http://mention-service:8082
      SENTIMENT_SERVICE_URL: http://sentiment-service:8083
      ALERT_SERVICE_URL: http://alert-service:8084
      INGEST_SERVICE_URL: http://ingest-service:8085
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      brand-service:
        condition: service_started
      mention-service:
        condition: service_started
      sentiment-service:
        condition: service_started
      alert-service:
        condition: service_started
      ingest-service:
        condition: service_started

  brand-service:
    build:
      context: ./backend/brand-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-sme}:${POSTGRES_PASSWORD:-sme_secret}@postgres:5432/${POSTGRES_DB:-sme_listening}?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  mention-service:
    build:
      context: ./backend/mention-service
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${POSTGRES_USER:-sme}:${POSTGRES_PASSWORD:-sme_secret}@postgres:5432/${POSTGRES_DB:-sme_listening}?sslmode=disable
      SENTIMENT_SERVICE_URL: http://sentiment-service:8083
      ALERT_SERVICE_URL: http://alert-service:8084
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      sentiment-service:
        condition: service_started
      alert-service:
        condition: service_started

  sentiment-service:
    build:
      context: ./backend/sentiment-service
    environment:
      PORT: "8083"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8083:8083"

  alert-service:
    build:
      context: ./backend/alert-service
    environment:
      PORT: "8084"
      DATABASE_URL: postgres://${POSTGRES_USER:-sme}:${POSTGRES_PASSWORD:-sme_secret}@postgres:5432/${POSTGRES_DB:-sme_listening}?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BRAND_SERVICE_URL: http://brand-service:8081
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      brand-service:
        condition: service_started

  ingest-service:
    build:
      context: ./backend/ingest-service
    environment:
      PORT: "8085"
      BRAND_SERVICE_URL: http://brand-service:8081
      MENTION_SERVICE_URL: http://mention-service:8082
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_FACEBOOK_HOST: ${RAPIDAPI_FACEBOOK_HOST:-facebook-scraper3.p.rapidapi.com}
      RAPIDAPI_YOUTUBE_HOST: ${RAPIDAPI_YOUTUBE_HOST:-youtube-v31.p.rapidapi.com}
      CRAWL_CRON: "*/30 * * * *"
      WORKER_CONCURRENCY: "5"
    ports:
      - "8085:8085"
    depends_on:
      brand-service:
        condition: service_started
      mention-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  postgres_data:
